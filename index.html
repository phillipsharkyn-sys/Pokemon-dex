<!DOCTYPE html>
<html>
<head>
    <title>Poké-Search Tool</title>
    <style>
        /* This makes the site look nice */
        body { font-family: sans-serif; text-align: center; background-color: #f0f0f0; transition: 0.3s; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 300px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 60%; }
        button { padding: 10px; background: #ff1f1f; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        #shinyBtn { background: #61a0a8; }
        img { width: 150px; height: 150px; }
        ul { text-align: left; list-style: none; padding: 0; }
        li { background: #eee; margin: 3px 0; padding: 5px; border-radius: 4px; text-transform: capitalize; }
    </style>
</head>
<body>

    <h1>Poké-Searcher</h1>
    <input type="text" id="pokemonName" placeholder="Enter Pokemon Name...">
    <br>
    <button onclick="searchPokemon()">Search</button>
    <button id="shinyBtn" onclick="toggleShiny()" style="display:none;">Show Shiny ✨</button>

    <div id="result" class="card" style="display:none;">
        <h2 id="name"></h2>
        <img id="sprite" src="" alt="Pokemon Sprite">
        <p><strong>Type:</strong> <span id="type"></span></p>
        <p><strong>Attacks:</strong></p>
        <ul id="moves"></ul>
    </div>

    <script>
        let currentSprites = { normal: "", shiny: "" };
        let isShiny = false;

        async function searchPokemon() {
            const name = document.getElementById('pokemonName').value.toLowerCase();
            const resultDiv = document.getElementById('result');
            const shinyBtn = document.getElementById('shinyBtn');
            
            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                const data = await response.json();

                // Save both versions for the toggle
                currentSprites.normal = data.sprites.front_default;
                currentSprites.shiny = data.sprites.front_shiny;
                isShiny = false; 

                // Update text and image
                document.getElementById('name').innerText = data.name.toUpperCase();
                document.getElementById('sprite').src = currentSprites.normal;
                document.getElementById('type').innerText = data.types.map(t => t.type.name).join(', ');

                // List first 4 moves
                const movesList = document.getElementById('moves');
                movesList.innerHTML = "";
                data.moves.slice(0, 4).forEach(m => {
                    let li = document.createElement('li');
                    li.innerText = m.move.name;
                    movesList.appendChild(li);
                });

                // Show the UI elements
                resultDiv.style.display = "block";
                shinyBtn.style.display = "inline-block";
                shinyBtn.innerText = "Show Shiny ✨";

            } catch (err) {
                alert("Pokemon not found! Try 'Pikachu' or 'Charizard'.");
            }
        }

        function toggleShiny() {
            const img = document.getElementById('sprite');
            const btn = document.getElementById('shinyBtn');
            
            if (isShiny) {
                img.src = currentSprites.normal;
                btn.innerText = "Show Shiny ✨";
            } else {
                img.src = currentSprites.shiny;
                btn.innerText = "Show Normal";
            }
            isShiny = !isShiny;
        }
    </script>
</body>
</html>
