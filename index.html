<!DOCTYPE html>
<html>
<head>
    <title>Poké-Checker Clean</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Main Search Container */
        .section-box { background: white; color: #333; padding: 25px; border-radius: 20px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 25px; border: 1px solid #ddd; width: 60%; outline: none; font-size: 16px; }
        button { padding: 12px 20px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; background: #ff1f1f; color: white; }

        /* Badge Styles */
        .type-badge { padding: 6px 14px; border-radius: 15px; color: white; font-size: 11px; font-weight: bold; text-transform: uppercase; margin: 4px; display: inline-block; }
        .fire { background: #ff4422; } .water { background: #3399ff; } .grass { background: #77cc55; } 
        .electric { background: #ffcc33; color: black; } .ice { background: #66ccff; color: black; }
        .fighting { background: #bb5544; } .poison { background: #aa5599; } .ground { background: #ddbb55; }
        .flying { background: #8899ff; } .psychic { background: #ff5599; } .bug { background: #aabb22; }
        .rock { background: #bbaa66; } .ghost { background: #6666bb; } .dragon { background: #7766ee; }
        .dark { background: #775544; } .steel { background: #aaaabb; color: black; } .fairy { background: #ee99ee; color: black; }
        .normal { background: #aaaa99; color: black; }

        /* Chat Window */
        #chat-container { width: 350px; height: 350px; background: #f0f2f5; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; border: 3px solid #ff1f1f; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; color: #333; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .user { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border-bottom-left-radius: 2px; }

        img { width: 160px; height: 160px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .label { font-size: 10px; font-weight: bold; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; display: block; }
    </style>
</head>
<body>

    <h1>Poké-Checker</h1>

    <div class="section-box">
        <input type="text" id="pokemonName" placeholder="Search name...">
        <button onclick="searchPokemon()">Go</button>

        <div id="result" style="display:none; margin-top: 10px;">
            <h2 id="name" style="text-transform: uppercase; margin-bottom: 0;"></h2>
            <img id="sprite" src="">
            <br>
            <button id="shinyBtn" onclick="toggleShiny()" style="background:#ffcc33; color:black; margin-bottom: 15px;">✨ Toggle Shiny</button>
            
            <span class="label">Type</span>
            <div id="types-container"></div>
            
            <span class="label">Weakness (2x Damage)</span>
            <div id="weakness-container"></div>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-window">
            <div class="msg bot">Welcome to the Chat Center. Name a Pokémon and I'll pull the stats!</div>
        </div>
        <div style="padding: 10px; background: white; display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="Chat with Bot..." style="flex: 1;">
            <button onclick="sendChatMessage()" style="width: 80px;">Send</button>
        </div>
    </div>

    <script>
        let sprites = { normal: "", shiny: "" };
        let isShiny = false;

        async function searchPokemon() {
            const name = document.getElementById('pokemonName').value.toLowerCase().trim();
            if(!name) return;

            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                const data = await res.json();
                
                sprites.normal = data.sprites.front_default;
                sprites.shiny = data.sprites.front_shiny;
                document.getElementById('sprite').src = sprites.normal;
                document.getElementById('name').innerText = data.name;
                isShiny = false;

                // Types
                const tCon = document.getElementById('types-container');
                tCon.innerHTML = data.types.map(t => `<span class="type-badge ${t.type.name}">${t.type.name}</span>`).join('');

                // Weaknesses (Fetch from Type URL)
                const wCon = document.getElementById('weakness-container');
                wCon.innerHTML = "...";
                let weaks = [];
                for (const t of data.types) {
                    const tRes = await fetch(t.type.url);
                    const tData = await tRes.json();
                    tData.damage_relations.double_damage_from.forEach(w => { if(!weaks.includes(w.name)) weaks.push(w.name); });
                }
                wCon.innerHTML = weaks.map(w => `<span class="type-badge" style="background:#555">${w}</span>`).join('');
                
                document.getElementById('result').style.display = "block";
            } catch (e) { alert("Pokémon not found!"); }
        }

        function toggleShiny() {
            isShiny = !isShiny;
            document.getElementById('sprite').src = isShiny ? sprites.shiny : sprites.normal;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            addBubble(msg, 'user');
            input.value = "";
            const botId = addBubble("Thinking...", 'bot');

            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${msg.toLowerCase()}`);
                const data = await res.json();
                updateBubble(botId, `Found it! <strong>${data.name}</strong> is a ${data.types[0].type.name} type.`);
            } catch {
                updateBubble(botId, "Sorry, I don't recognize that name.");
            }
        }

        function addBubble(text, sender) {
            const id = 'm-' + Date.now();
            const div = document.createElement('div');
            div.id = id; div.className = `msg ${sender}`; div.innerHTML = text;
            const win = document.getElementById('chat-window');
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
            return id;
        }

        function updateBubble(id, text) {
            document.getElementById(id).innerHTML = text;
        }

        // Enter key listeners
        document.getElementById('pokemonName').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchPokemon(); });
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChatMessage(); });
    </script>
</body>
</html>
