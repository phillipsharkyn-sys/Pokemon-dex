<!DOCTYPE html>
<html>
<head>
    <title>Poké-Type & Weakness</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #2c3e50; color: white; transition: 0.5s; padding-top: 50px; }
        .card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 350px; margin: 20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .type-badge, .weak-badge { padding: 5px 12px; border-radius: 15px; color: white; font-weight: bold; text-transform: uppercase; font-size: 11px; margin: 3px; display: inline-block; }
        
        /* Type Colors */
        .fire { background-color: #ff4422; } .water { background-color: #3399ff; }
        .grass { background-color: #77cc55; } .electric { background-color: #ffcc33; color: black; }
        .ice { background-color: #66ccff; color: black; } .fighting { background-color: #bb5544; }
        .poison { background-color: #aa5599; } .ground { background-color: #ddbb55; }
        .flying { background-color: #8899ff; } .psychic { background-color: #ff5599; }
        .bug { background-color: #aabb22; } .rock { background-color: #bbaa66; }
        .ghost { background-color: #6666bb; } .dragon { background-color: #7766ee; }
        .dark { background-color: #775544; } .steel { background-color: #aaaabb; color: black; }
        .fairy { background-color: #ee99ee; color: black; } .normal { background-color: #aaaa99; color: black; }

        input { padding: 12px; border-radius: 25px; border: none; width: 200px; }
        button { padding: 12px 20px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; }
        #searchBtn { background: #ff1f1f; color: white; }
        #shinyBtn { background: #ffcc33; color: black; display: none; margin-top: 10px; }
        img { width: 200px; height: 200px; }
        .label { font-weight: bold; margin-top: 15px; color: #666; display: block; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Poké-Checker</h1>
    <input type="text" id="pokemonName" placeholder="Enter Pokémon Name...">
    <button id="searchBtn" onclick="searchPokemon()">Search</button>

    <div id="result" class="card" style="display:none;">
        <h2 id="name"></h2>
        <img id="sprite" src="" alt="Pokemon">
        <button id="shinyBtn" onclick="toggleShiny()">✨ Show Shiny</button>
        
        <span class="label">Type</span>
        <div id="types-container"></div>
        
        <span class="label">Weaknesses (Take 2x Damage)</span>
        <div id="weakness-container"></div>
    </div>

    <script>
        let sprites = { normal: "", shiny: "" };
        let isShiny = false;

        async function searchPokemon() {
            const name = document.getElementById('pokemonName').value.toLowerCase();
            try {
                // Get basic info
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                const data = await response.json();

                sprites.normal = data.sprites.front_default;
                sprites.shiny = data.sprites.front_shiny;
                isShiny = false;
                document.getElementById('sprite').src = sprites.normal;
                document.getElementById('name').innerText = data.name.toUpperCase();

                // Show Types
                const typeContainer = document.getElementById('types-container');
                typeContainer.innerHTML = "";
                data.types.forEach(t => {
                    const span = document.createElement('span');
                    span.classList.add('type-badge', t.type.name);
                    span.innerText = t.type.name;
                    typeContainer.appendChild(span);
                });

                // Set Page Background
                const mainType = data.types[0].type.name;
                document.body.style.backgroundColor = getComputedStyle(document.querySelector('.' + mainType)).backgroundColor;

                // Get Weaknesses (Damage Relations)
                const weakContainer = document.getElementById('weakness-container');
                weakContainer.innerHTML = "";
                
                // We check weaknesses for ALL types the Pokemon has
                for (const t of data.types) {
                    const typeRes = await fetch(t.type.url);
                    const typeData = await typeRes.json();
                    typeData.damage_relations.double_damage_from.forEach(w => {
                        // Avoid duplicates if both types share a weakness
                        if (!weakContainer.innerHTML.includes(w.name)) {
                            const span = document.createElement('span');
                            span.classList.add('weak-badge', w.name);
                            span.innerText = w.name;
                            weakContainer.appendChild(span);
                        }
                    });
                }

                document.getElementById('result').style.display = "block";
                document.getElementById('shinyBtn').style.display = "inline-block";
                document.getElementById('shinyBtn').innerText = "✨ Show Shiny";

            } catch (err) {
                alert("Pokémon not found!");
            }
        }

        function toggleShiny() {
            const img = document.getElementById('sprite');
            const btn = document.getElementById('shinyBtn');
            isShiny = !isShiny;
            img.src = isShiny ? sprites.shiny : sprites.normal;
            btn.innerText = isShiny ? "⬅️ Show Normal" : "✨ Show Shiny";
        }
    </script>
</body>
</html>
