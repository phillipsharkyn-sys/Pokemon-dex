<!DOCTYPE html>
<html>
<head>
    <title>Poké-Checker & Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Shared Styles */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Search Card Section */
        .section-box { background: white; color: #333; padding: 25px; border-radius: 20px; width: 350px; margin: 20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        input { padding: 12px; border-radius: 25px; border: 1px solid #ddd; width: 200px; outline: none; }
        button { padding: 12px 20px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; background: #ff1f1f; color: white; }

        /* Chat Section */
        #chat-container { width: 350px; height: 400px; background: #f0f2f5; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 50px; border: 3px solid #ff1f1f; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; color: #333; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; }
        .user { align-self: flex-end; background: #0084ff; color: white; }
        .bot { align-self: flex-start; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Badge Styles */
        .type-badge { padding: 4px 10px; border-radius: 12px; color: white; font-size: 10px; font-weight: bold; text-transform: uppercase; margin: 2px; display: inline-block; }
        .fire { background: #ff4422; } .water { background: #3399ff; } .grass { background: #77cc55; } .electric { background: #ffcc33; color: black; }
        
        img { width: 150px; height: 150px; }
    </style>
</head>
<body>

    <h1>Poké-Checker Ultra</h1>

    <div class="section-box">
        <input type="text" id="pokemonName" placeholder="Enter Name...">
        <button onclick="searchPokemon()">Search</button>

        <div id="result" style="display:none; margin-top: 15px;">
            <h2 id="name" style="text-transform: uppercase;"></h2>
            <img id="sprite" src="">
            <br>
            <button id="shinyBtn" onclick="toggleShiny()" style="background:#ffcc33; color:black; font-size: 12px;">✨ Toggle Shiny</button>
            <p><strong>Type:</strong> <span id="types-container"></span></p>
            <p><strong>Weaknesses:</strong> <br><span id="weakness-container"></span></p>
        </div>
    </div>

    <h3 style="margin-top: 20px;">Poké-Chat Assistant</h3>
    <div id="chat-container">
        <div id="chat-window">
            <div class="msg bot">Ask me about any Pokémon!</div>
        </div>
        <div style="padding: 10px; background: white; display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="Chat..." style="width: 70%;">
            <button onclick="sendChatMessage()" style="width: 30%; padding: 5px;">Send</button>
        </div>
    </div>

    <script>
        // --- LOGIC FOR SEARCH SECTION ---
        let sprites = { normal: "", shiny: "" };
        let isShiny = false;

        async function searchPokemon() {
            const name = document.getElementById('pokemonName').value.toLowerCase().trim();
            if(!name) return;
            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                const data = await res.json();
                
                sprites.normal = data.sprites.front_default;
                sprites.shiny = data.sprites.front_shiny;
                document.getElementById('sprite').src = sprites.normal;
                document.getElementById('name').innerText = data.name;

                // Types
                const tCon = document.getElementById('types-container');
                tCon.innerHTML = data.types.map(t => `<span class="type-badge ${t.type.name}">${t.type.name}</span>`).join('');

                // Weaknesses
                const wCon = document.getElementById('weakness-container');
                wCon.innerHTML = "Loading...";
                let weaks = [];
                for (const t of data.types) {
                    const tRes = await fetch(t.type.url);
                    const tData = await tRes.json();
                    tData.damage_relations.double_damage_from.forEach(w => { if(!weaks.includes(w.name)) weaks.push(w.name); });
                }
                wCon.innerHTML = weaks.map(w => `<span class="type-badge" style="background:#555">${w}</span>`).join('');
                
                document.getElementById('result').style.display = "block";
            } catch (e) { alert("Not found!"); }
        }

        function toggleShiny() {
            isShiny = !isShiny;
            document.getElementById('sprite').src = isShiny ? sprites.shiny : sprites.normal;
        }

        // --- LOGIC FOR CHAT SECTION ---
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            addBubble(msg, 'user');
            input.value = "";
            const botId = addBubble("Checking...", 'bot');

            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${msg.toLowerCase()}`);
                const data = await res.json();
                updateBubble(botId, `That's <strong>${data.name}</strong>! It's a ${data.types[0].type.name} type.`);
            } catch {
                updateBubble(botId, "I don't know that one. Try a different name!");
            }
        }

        function addBubble(text, sender) {
            const id = 'm-' + Date.now();
            const div = document.createElement('div');
            div.id = id; div.className = `msg ${sender}`; div.innerHTML = text;
            document.getElementById('chat-window').appendChild(div);
            document.getElementById('chat-window').scrollTop = 9999;
            return id;
        }

        function updateBubble(id, text) {
            document.getElementById(id).innerHTML = text;
        }
    </script>
</body>
</html>
