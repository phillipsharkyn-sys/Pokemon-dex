<!DOCTYPE html>
<html>
<head>
    <title>Poké-Search Tool</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 300px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px; background: #ff1f1f; color: white; border: none; border-radius: 5px; cursor: pointer; }
        img { width: 150px; }
        .type { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h1>Poké-Searcher</h1>
    <input type="text" id="pokemonName" placeholder="Enter Pokemon Name...">
    <button onclick="searchPokemon()">Search</button>

    <div id="result" class="card" style="display:none;">
        <h2 id="name"></h2>
        <img id="sprite" src="" alt="Pokemon Sprite">
        <p><strong>Type:</strong> <span id="type"></span></p>
        <p><strong>Weaknesses:</strong> <span id="weakness"></span></p>
        <p><strong>Sample Attacks:</strong></p>
        <ul id="moves" style="text-align: left;"></ul>
    </div>

    <script>
        async function searchPokemon() {
            const name = document.getElementById('pokemonName').value.toLowerCase();
            const resultDiv = document.getElementById('result');
            
            try {
                // Fetch basic data
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                const data = await response.json();

                // Update UI
                document.getElementById('name').innerText = data.name.toUpperCase();
                document.getElementById('sprite').src = data.sprites.front_default;
                document.getElementById('type').innerText = data.types.map(t => t.type.name).join(', ');

                // Get moves (first 4)
                const movesList = document.getElementById('moves');
                movesList.innerHTML = "";
                data.moves.slice(0, 4).forEach(m => {
                    let li = document.createElement('li');
                    li.innerText = m.move.name;
                    movesList.appendChild(li);
                });

                // Fetch weaknesses (type data)
                const typeUrl = data.types[0].type.url;
                const typeResponse = await fetch(typeUrl);
                const typeData = await typeResponse.json();
                const weaknesses = typeData.damage_relations.double_damage_from.map(w => w.name).join(', ');
                document.getElementById('weakness').innerText = weaknesses;

                resultDiv.style.display = "block";
            } catch (err) {
                alert("Pokemon not found! Check your spelling.");
            }
        }
    </script>
</body>
</html>
